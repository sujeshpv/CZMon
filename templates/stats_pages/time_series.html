<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  .stats-filter-row { display: flex; gap: 28px; align-items: end; flex-wrap: wrap; }
  .stats-filter-row .filter-select { min-width: 190px; }
  .chart-title { color: #444; font-size: 18px; font-weight: 700; margin-bottom: 24px; text-align: center; }
  .chart-frame { height: 350px; position: relative; }
  .time-options { border-top: 1px solid #ddd; display: flex; gap: 10px; justify-content: center; margin-top: 18px; padding-top: 10px; }
  .stats-panel[hidden] { display: none !important; }
  .time-btn { background: #f8f9fa; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; padding: 9px 18px; }
  .time-btn.active { background: #1769b0; border-color: #1769b0; color: #fff; }
  .stats-status { color: #66717d; padding: 18px 12px; text-align: center; }
  .stats-status.error { color: #9d1c1c; }
  .point-details-panel[hidden] { display: none; }
  .point-details-header { align-items: center; display: flex; justify-content: space-between; }
  .point-details-header h3 { color: #14589b; margin: 0; }
  .point-details-clear { background: #fff; border: 1px solid #b9c2cc; border-radius: 4px; color: #45515d; cursor: pointer; padding: 7px 12px; }
  .point-meta { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 16px; }
  .point-meta-item { background: #f7f9fb; border-radius: 4px; padding: 10px 12px; }
  .point-meta-label { color: #66717d; display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
  .point-summary { line-height: 1.5; margin: 16px 0; }
  .metric-detail-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 14px 0; }
  .metric-detail-card { background: #f7f9fb; border: 1px solid #e1e5e9; border-radius: 5px; min-width: 0; overflow: hidden; padding: 14px; }
  .metric-detail-value { color: #1e2b38; display: block; font-size: 20px; font-weight: 700; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .metric-detail-table { border-collapse: collapse; margin-top: 14px; width: 100%; }
  .metric-detail-table th { background: #f4f7fa; color: #14589b; font-size: 13px; text-align: left; }
  .metric-detail-table th, .metric-detail-table td { border: 1px solid #e1e5e9; padding: 9px 11px; vertical-align: top; }
  .metric-detail-table td { font-size: 13px; }
  .detail-selectors { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0; }
  .detail-selectors .filter-select { min-width: 220px; }
  .detail-help { color: #66717d; margin: 14px 0 0; }
  .stats-filter-row .vm-search-input { min-width: 220px; }
  .stats-filter-row #vmFilter { min-width: 260px; }
  .stats-filter-row .ngt-filter-select { min-width: 180px; }
  @media (max-width: 640px) { .point-meta { grid-template-columns: 1fr; } }
</style>

<section class="stats-panel stats-filter-row">
  <label class="filter-item" for="azFilter">
    <span class="filter-label">AZ</span>
    <select class="filter-select" id="azFilter">
      <option value="">Select AZ</option>
      {% for az in azs %}<option value="{{ az }}">{{ az }}</option>{% endfor %}
    </select>
  </label>
  <label class="filter-item" for="setupTypeFilter">
    <span class="filter-label">Setup Type</span>
    <select class="filter-select" id="setupTypeFilter">
      <option value="">Select Setup Type</option>
    </select>
  </label>
  <label class="filter-item" for="targetFilter">
    <span class="filter-label" id="targetFilterLabel">Target</span>
    <select class="filter-select" id="targetFilter" disabled>
      <option value="">Select Target</option>
    </select>
  </label>
  {% if selected_stat.parser == "ngt_status" %}
  <label class="filter-item" for="vmSearch" id="vmSearchItem">
    <span class="filter-label">Search VM</span>
    <input class="filter-select vm-search-input" id="vmSearch" type="search" placeholder="Search by name or UUID" disabled autocomplete="off">
  </label>
  <label class="filter-item" for="vmFilter" id="vmFilterItem">
    <span class="filter-label">VM</span>
    <select class="filter-select" id="vmFilter" disabled>
      <option value="">Select VM</option>
    </select>
  </label>
  <label class="filter-item" for="ngtStateFilter">
    <span class="filter-label">NGT State</span>
    <select class="filter-select ngt-filter-select" id="ngtStateFilter" disabled>
      <option value="">All NGT States</option>
    </select>
  </label>
  <label class="filter-item" for="ngtEnabledFilter">
    <span class="filter-label">Enabled</span>
    <select class="filter-select ngt-filter-select" id="ngtEnabledFilter" disabled>
      <option value="">All</option>
    </select>
  </label>
  <label class="filter-item" for="ngtReachableFilter">
    <span class="filter-label">Reachable</span>
    <select class="filter-select ngt-filter-select" id="ngtReachableFilter" disabled>
      <option value="">All</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </label>
  {% endif %}
</section>

{% if selected_stat.parser != "ngt_status" %}
<section class="stats-panel" id="statsChartPanel">
  <div class="chart-title">{{ selected_stat.name }}</div>
  <div class="chart-frame"><canvas id="statsChart"></canvas></div>
  <div class="stats-status" id="statsStatus">Loading data…</div>
  <div class="time-options">
    <button class="time-btn" data-range="12h" type="button">12 Hours</button>
    <button class="time-btn" data-range="24h" type="button">24 Hours</button>
    <button class="time-btn" data-range="7d" type="button">7 Days</button>
    <button class="time-btn" data-range="30d" type="button">30 Days</button>
    <button class="time-btn active" data-range="90d" type="button">90 Days</button>
  </div>
</section>
{% endif %}

<section class="stats-panel point-details-panel" id="pointDetailsPanel" hidden>
  <header class="point-details-header">
    <h3 id="pointDetailsTitle">{{ selected_stat.name }} Details</h3>
    <button class="point-details-clear" id="pointDetailsClear" type="button">Clear selection</button>
  </header>
  <div class="point-meta" style="margin-top: 16px;">
    <div class="point-meta-item">
      <span class="point-meta-label">Target</span>
      <strong id="pointDetailsTarget"></strong>
    </div>
    <div class="point-meta-item">
      <span class="point-meta-label">Timestamp</span>
      <strong id="pointDetailsTimestamp"></strong>
    </div>
  </div>
  <p class="point-summary" id="pointDetailsSummary"></p>
  <div id="pointMetricDetails"></div>
</section>

<script>
(() => {
  "use strict";

  const config = JSON.parse(document.getElementById("selected-stat-config").textContent);
  const azToPcs = JSON.parse(document.getElementById("stats-az-to-pcs").textContent);
  const pcToPes = JSON.parse(document.getElementById("stats-pc-to-pes").textContent);
  const targetNames = JSON.parse(document.getElementById("stats-target-names").textContent);
  const status = document.getElementById("statsStatus");
  const azFilter = document.getElementById("azFilter");
  const setupTypeFilter = document.getElementById("setupTypeFilter");
  const targetFilter = document.getElementById("targetFilter");
  const targetFilterLabel = document.getElementById("targetFilterLabel");
  const vmSearchItem = document.getElementById("vmSearchItem");
  const vmFilterItem = document.getElementById("vmFilterItem");
  const vmSearch = document.getElementById("vmSearch");
  const vmFilter = document.getElementById("vmFilter");
  const ngtStateFilter = document.getElementById("ngtStateFilter");
  const ngtEnabledFilter = document.getElementById("ngtEnabledFilter");
  const ngtReachableFilter = document.getElementById("ngtReachableFilter");
  const pointDetailsPanel = document.getElementById("pointDetailsPanel");
  const pointDetailsClear = document.getElementById("pointDetailsClear");
  const pointDetailsTarget = document.getElementById("pointDetailsTarget");
  const pointDetailsTimestamp = document.getElementById("pointDetailsTimestamp");
  const pointDetailsSummary = document.getElementById("pointDetailsSummary");
  const pointMetricDetails = document.getElementById("pointMetricDetails");
  const statsChartPanel = document.getElementById("statsChartPanel");
  const datasetConfig = config.datasets || [{
    key: "value", label: config.name, color: "#1769b0", axis: "y"
  }];
  let currentRange = "90d";
  let pointRecords = [];
  let clusterVms = [];
  let selectedVmUuid = "";
  let lastNgtPointItem = null;

  function isNgtStat() {
    return config.parser === "ngt_status";
  }

  function showLatestNgtDetails() {
    if (!isNgtStat() || !pointRecords.length) return;
    lastNgtPointItem = null;
    showPointDetails(pointRecords[pointRecords.length - 1]);
  }

  function chartScales() {
    const scales = {
      x: {
        stacked: Boolean(config.stacked),
        ticks: { maxRotation: 45, minRotation: 45 }
      },
      y: {
        beginAtZero: true,
        max: config.status_axis ? 1 : (config.is_percentage ? 100 : undefined),
        stacked: Boolean(config.stacked),
        title: { display: true, text: config.y_axis || "Value" }
      }
    };
    if (config.status_axis) {
      scales.y.ticks = {
        stepSize: 1,
        callback: (value) => Number(value) === 1 ? "ON" : "OFF"
      };
    }
    if (datasetConfig.some((item) => item.axis === "y1")) {
      scales.y1 = {
        beginAtZero: true,
        position: "right",
        grid: { drawOnChartArea: false },
        title: { display: true, text: "IOPS" }
      };
    }
    return scales;
  }

  const statsChartCanvas = document.getElementById("statsChart");
  const chart = statsChartCanvas ? new Chart(statsChartCanvas, {
    type: config.chart_type || "line",
    data: { labels: [], datasets: datasetConfig.map((item) => ({
        label: item.label,
        data: [],
        borderColor: item.color,
        backgroundColor: item.color,
        borderWidth: 3,
        fill: false,
        pointRadius: 4,
        pointHoverRadius: 7,
        tension: .15,
        stepped: Boolean(item.stepped),
        yAxisID: item.axis || "y",
        spanGaps: true
      })) },
    options: {
      maintainAspectRatio: false,
      responsive: true,
      interaction: { intersect: true, mode: "nearest" },
      plugins: {
        legend: {
          display: datasetConfig.length > 1,
          labels: {
            filter(item, data) {
              return !config.hide_empty_datasets || !data.datasets[item.datasetIndex].hidden;
            }
          }
        },
        tooltip: {
          callbacks: {
            label(context) {
              if (config.status_axis) {
                return `${context.dataset.label}: ${Number(context.raw) === 1 ? "ON" : "OFF"}`;
              }
              return `${context.dataset.label}: ${context.formattedValue}`;
            }
          }
        }
      },
      scales: chartScales(),
      onClick(event) {
        const selected = chart.getElementsAtEventForMode(
          event, "nearest", { intersect: true }, true
        );
        if (selected.length) showPointDetails(pointRecords[selected[0].index]);
      }
    }
  }) : null;

  function replaceOptions(select, placeholder, options) {
    select.replaceChildren(new Option(placeholder, ""));
    options.forEach((item) => {
      const value = typeof item === "string" ? item : item.key;
      const label = typeof item === "string" ? item : item.label;
      select.add(new Option(label, value));
    });
    select.disabled = options.length === 0;
  }

  function createElement(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined && text !== null) element.textContent = String(text);
    return element;
  }

  function addDetailCards(items) {
    const grid = createElement("div", "metric-detail-grid");
    items.forEach(([label, value]) => {
      const card = createElement("div", "metric-detail-card");
      card.appendChild(createElement("span", "point-meta-label", label));
      const text = value === undefined || value === null ? "" : String(value);
      const valueEl = createElement("span", "metric-detail-value", text);
      if (text) valueEl.title = text;
      card.appendChild(valueEl);
      grid.appendChild(card);
    });
    pointMetricDetails.appendChild(grid);
  }

  function addDetailTable(headers, rows) {
    if (!rows.length) return;
    const table = createElement("table", "metric-detail-table");
    const headRow = table.createTHead().insertRow();
    headers.forEach((header) => {
      headRow.appendChild(createElement("th", "", header));
    });
    const body = table.createTBody();
    rows.forEach((values) => {
      const row = body.insertRow();
      values.forEach((value) => {
        row.appendChild(createElement("td", "", value));
      });
    });
    pointMetricDetails.appendChild(table);
  }

  function renderSnapshotDetails(details) {
    let parsedData = details;
    if (typeof parsedData === "string") { try { parsedData = JSON.parse(parsedData); } catch(e){} }
    let val = parsedData?.recovery_point_usage;
    addDetailCards([["Usage", val == null ? "No Data" : `${val}%`]]);
  }

  function renderExpiredSnapshotDetails(details) {
    let parsedData = details;
    if (typeof parsedData === "string") { try { parsedData = JSON.parse(parsedData); } catch(e){} }

    const summary = parsedData?.summary_data || {};
    const isSuccessful = parsedData?.is_successful;
    const snapshots = parsedData?.snapshots_data || [];

    document.getElementById("pointDetailsSummary").textContent = `Found ${summary.total_expired_snapshots || 0} expired snapshots on this Prism Central.`;

    if (isSuccessful === false) {
      addDetailCards([
        ["Audit Status", "FAILED"], 
        ["Error", summary.error || "Unknown Error"]
      ]);
      return;
    }

    addDetailCards([
      ["Total Expired", summary.total_expired_snapshots ?? 0],
      ["Oldest Snapshot", summary.oldest_snapshot_date || "N/A"],
      ["Status", summary.status || "N/A"]
    ]);

    if (snapshots.length > 0) {
      const rows = snapshots.map(snapshot => [snapshot.vm_name, snapshot.rp_name, snapshot.expired_at]);
      addDetailTable(["VM Name", "Recovery Point", "Expired At"], rows);
    }
  }

  function renderCrashDetails(details) {
    let parsedData = details;
    if (typeof parsedData === "string") { try { parsedData = JSON.parse(parsedData); } catch(e){} }

    let status = parsedData?.status || "Unknown";
    let hasCrash = parsedData?.crash_found;
    let logOutput = parsedData?.details || parsedData?.error || "No logs available";

    addDetailCards([
      ["Audit Status", status],
      ["Crash Found", hasCrash === true ? "YES" : (hasCrash === false ? "NO" : "N/A")]
    ]);

    const logCard = createElement("div", "metric-detail-card");
    logCard.style.marginTop = "14px";
    logCard.appendChild(createElement("span", "point-meta-label", "Log Output"));
    const pre = createElement("pre", "");
    pre.style.whiteSpace = "pre-wrap";
    pre.style.fontSize = "12px";
    pre.textContent = logOutput;
    logCard.appendChild(pre);
    pointMetricDetails.appendChild(logCard);
  }

  function renderAhvDetails(details) {
    const clusterName = Object.keys(details || {}).find(k => !k.startsWith("_"));
    const entries = Array.isArray(details?.[clusterName]) ? details[clusterName] : [];
    const rawHostsshOutput = details?._raw_hostssh_output;
    
    // Collect all hosts and their partitions
    const hostsData = [];
    
    entries.forEach((entry) => {
      if (!entry || typeof entry !== "object") return;
      Object.entries(entry).forEach(([hostName, hostData]) => {
        const partitions = hostData?.partitions || hostData || {};
        const rawOutput = hostData?.raw_output;
        if (typeof partitions !== "object") return;
        
        hostsData.push({ hostName, partitions, rawOutput });
      });
    });
    
    addDetailCards([["Cluster", clusterName || "Unknown"]]);
    
    // Add host and partition filter dropdowns
    const selectors = createElement("div", "detail-selectors");
    
    // Host dropdown
    const hostLabel = createElement("label", "filter-item");
    hostLabel.appendChild(createElement("span", "filter-label", "AHV Host"));
    const hostSelect = createElement("select", "filter-select");
    const hostOptions = [
      { key: "", label: "All Hosts" },
      ...hostsData.map(h => ({ key: h.hostName, label: h.hostName }))
    ];
    replaceOptions(hostSelect, "", hostOptions);
    hostLabel.appendChild(hostSelect);
    selectors.appendChild(hostLabel);
    
    // Partition dropdown
    const partitionLabel = createElement("label", "filter-item");
    partitionLabel.appendChild(createElement("span", "filter-label", "Partition"));
    const partitionSelect = createElement("select", "filter-select");
    partitionLabel.appendChild(partitionSelect);
    selectors.appendChild(partitionLabel);
    
    pointMetricDetails.appendChild(selectors);
    
    const tableContainer = createElement("div");
    tableContainer.style.marginTop = "16px";
    pointMetricDetails.appendChild(tableContainer);
    
    function updatePartitionOptions(selectedHost) {
      const partitionNames = new Set();
      
      hostsData.forEach(({ hostName, partitions }) => {
        if (selectedHost && hostName !== selectedHost) return;
        
        Object.keys(partitions).forEach(mountPoint => {
          if (partitions[mountPoint] && typeof partitions[mountPoint] === "object") {
            partitionNames.add(mountPoint);
          }
        });
      });
      
      const partitionOptions = [
        { key: "", label: "All Partitions" },
        ...Array.from(partitionNames).sort().map(p => ({ key: p, label: p }))
      ];
      replaceOptions(partitionSelect, "", partitionOptions);
    }
    
    function renderPartitionTable(selectedHost, selectedPartition) {
      tableContainer.replaceChildren();
      const rows = [];
      
      hostsData.forEach(({ hostName, partitions }) => {
        // Filter by selected host if specified
        if (selectedHost && hostName !== selectedHost) return;
        
        Object.entries(partitions).forEach(([mountPoint, partition]) => {
          if (!partition || typeof partition !== "object") return;
          // Filter by selected partition if specified
          if (selectedPartition && mountPoint !== selectedPartition) return;
          
          rows.push([
            hostName,
            mountPoint,
            partition.total || "N/A",
            partition.available || "N/A",
            partition.usage || "N/A"
          ]);
        });
      });
      
      if (rows.length > 0) {
        const table = createElement("table", "metric-detail-table");
        const headRow = table.createTHead().insertRow();
        ["AHV Host", "Partition", "Total", "Available", "Usage"].forEach((header) => {
          headRow.appendChild(createElement("th", "", header));
        });
        const body = table.createTBody();
        rows.forEach((values) => {
          const row = body.insertRow();
          values.forEach((value) => {
            row.appendChild(createElement("td", "", value));
          });
        });
        tableContainer.appendChild(table);
      } else {
        tableContainer.appendChild(
          createElement("p", "detail-help", "No partition data available for the selected filters.")
        );
      }
    }
    
    // Initial setup
    updatePartitionOptions("");
    renderPartitionTable("", "");
    
    // Update partition options and table when host selection changes
    hostSelect.addEventListener("change", () => {
      updatePartitionOptions(hostSelect.value);
      renderPartitionTable(hostSelect.value, partitionSelect.value);
    });
    
    // Update table when partition selection changes
    partitionSelect.addEventListener("change", () => {
      renderPartitionTable(hostSelect.value, partitionSelect.value);
    });
  }

  function renderVmDetails(details) {
    const rows = [];
    Object.entries(details || {}).forEach(([host, values]) => {
      if (host === "Cluster_name" || !values || typeof values !== "object") return;
      rows.push([
        host,
        Number(values.powered_on || 0),
        Number(values.powered_off || 0),
        Number(values.affinity_enabled_count || 0)
      ]);
    });
    addDetailCards([["Cluster", details?.Cluster_name || "Unknown"]]);
    addDetailTable(["Host / SVM", "Powered On", "Powered Off", "Affinity VMs"], rows);
  }

  function renderTaskDetails(details) {
    const counts = details?.counts || {};
    addDetailCards([
      ["Total", details?.total || 0],
      ["Pending", counts.pending || 0],
      ["Failed", counts.failed || 0]
    ]);
    const rows = [];
    Object.entries(details?.tasks || {}).forEach(([statusName, tasks]) => {
      if (!Array.isArray(tasks)) return;
      tasks.forEach((task) => {
        if (rows.length >= 100) return;
        if (task && typeof task === "object") {
          const [taskId, taskDetail] = Object.entries(task)[0] || ["Unknown", ""];
          rows.push([statusName, taskId, taskDetail]);
        }
      });
    });
    addDetailTable(["Status", "Task ID", "Detail"], rows);
    if (rows.length >= 100) {
      pointMetricDetails.appendChild(
        createElement("p", "detail-help", "Showing the first 100 task records.")
      );
    }
  }

  function renderPgwDetails(details) {
    addDetailCards([
      ["PGW Status", details?.is_online ? "ON" : "OFF"]
    ]);
    const rows = Object.entries(details?.status_data || {}).map(([key, value]) => [
      key.replaceAll("_", " "),
      value
    ]);
    if (details?.error_message) rows.unshift(["Error", details.error_message]);
    addDetailTable(["Property", "Value"], rows);
  }

  function renderUtilizationDetails(details) {
    addDetailCards([
      ["CPU", `${Number(details?.cpu_usage_percent || 0)}%`],
      ["Memory", `${Number(details?.memory_usage_percent || 0)}%`],
      ["IOPS", Number(details?.iops || 0)],
      ["Underutilized", details?.is_underutilized ? "Yes" : "No"]
    ]);
  }

  function renderGenericDetails(details) {
    const rows = Object.entries(details || {}).map(([key, value]) => [
      key.replaceAll("_", " "),
      value && typeof value === "object" ? "See collected metric summary" : value
    ]);
    addDetailTable(["Property", "Value"], rows);
  }

  function renderLsofDetails(details) {
    const hosts = Array.isArray(details?.host_results) ? details.host_results : [];
    addDetailCards([
      ["Collection Status", details?.status || "UNKNOWN"],
      ["Maximum lsof Rows", details?.lsof_count ?? "N/A"],
      ["CVMs Checked", details?.host_count ?? hosts.length],
      ["Successful CVMs", details?.successful_hosts ?? "N/A"],
      ["Failed CVMs", details?.failed_hosts ?? "N/A"]
    ]);

    if (hosts.length) {
      const rows = hosts.map((host) => [
        host.host || "Unknown",
        host.lsof_count ?? "N/A",
        host.status || "UNKNOWN",
        host.error || ""
      ]);
      addDetailTable(["CVM", "lsof Rows", "Status", "Error"], rows);
    }
  }

  function renderNgtDetails(details) {
    const vms = Array.isArray(details?.vms) ? details.vms : [];
    const selectedVms = selectedVmUuid
      ? vms.filter((vm) => vm.uuid === selectedVmUuid)
      : vms.filter((vm) => vmMatchesNgtFilters(vm));

    if (selectedVmUuid) {
      const vm = selectedVms[0];
      if (!vm) {
        addDetailCards([["VM", "Not found in this snapshot for the selected cluster"]]);
        return;
      }
      addDetailCards([
        ["VM", vm.name || "Unknown"],
        ["UUID", vm.uuid || ""],
        ["Power", vm.power_state || ""],
        ["NGT State", vm.ngt_state || ""],
        ["Enabled", vm.ngt_enabled_state || ""],
        ["Version", vm.version || ""],
        ["Available Version", vm.available_version || ""],
        ["ISO Mount", vm.iso_mount_state || ""],
        ["Reachable", vm.is_reachable ? "Yes" : "No"],
        ["Guest OS", vm.guest_os_version || ""]
      ]);
      const caps = Array.isArray(vm.enabled_capability_list)
        ? vm.enabled_capability_list
        : [];
      if (caps.length) {
        addDetailTable(["Enabled Capabilities"], caps.map((cap) => [cap]));
      }
      return;
    }

    addDetailCards([
      ["Cluster", details?.Cluster_name || "Unknown"],
      ["Total VMs", Number(details?.total_vms || 0)],
      ["NGT Installed", Number(details?.ngt_installed || 0)],
      ["NGT Not Installed", Number(details?.ngt_not_installed || 0)],
      ["NGT Enabled", Number(details?.ngt_enabled || 0)],
      ["NGT Disabled", Number(details?.ngt_disabled || 0)],
      ["NGT Reachable", Number(details?.ngt_reachable || 0)],
      ["Showing", `${selectedVms.length} of ${vms.length}`]
    ]);
    const rows = selectedVms.map((vm) => [
      vm.name || "Unknown",
      vm.uuid || "",
      vm.power_state || "",
      vm.ngt_state || "",
      vm.ngt_enabled_state || "",
      vm.version || "",
      vm.is_reachable ? "Yes" : "No"
    ]);
    addDetailTable(
      ["VM Name", "UUID", "Power", "NGT State", "Enabled", "Version", "Reachable"],
      rows
    );
    if (!rows.length) {
      pointMetricDetails.appendChild(
        createElement("p", "detail-help", "No VMs match the selected NGT filters.")
      );
    }
  }

  function showPointDetails(item) {
    if (!item) return;
    const date = new Date(item.timestamp);
    const details = item.details ?? item.data ?? {};
    pointDetailsTarget.textContent = item.ip || "Unknown";
    pointDetailsTimestamp.textContent = date.toLocaleString();
    pointDetailsSummary.textContent = item.summary || "Collected metric details";
    if (isNgtStat()) {
      lastNgtPointItem = item;
      if (selectedVmUuid) {
        const selectedVm = clusterVms.find((vm) => vm.uuid === selectedVmUuid);
        if (selectedVm) {
          pointDetailsSummary.textContent = `NGT status for ${selectedVm.label}`;
        }
      }
    }
    pointMetricDetails.replaceChildren();

    if (config.parser === "ahv_partition_usage") renderAhvDetails(details);
    else if (config.parser === "vm_power_states") renderVmDetails(details);
    else if (config.parser === "task_monitor") renderTaskDetails(details);
    else if (config.parser === "pgw_status") renderPgwDetails(details);
    else if (config.parser === "cluster_utilization") renderUtilizationDetails(details);
    else if (config.parser === "snapshot_usage") renderSnapshotDetails(details);
    else if (config.parser === "expired_snapshots") renderExpiredSnapshotDetails(details);
    else if (config.parser === "node_crash") renderCrashDetails(details);
    else if (config.parser === "lsof_counts") renderLsofDetails(details);
    else if (config.parser === "ngt_status") renderNgtDetails(details);
    else renderGenericDetails(details);

    pointDetailsPanel.hidden = false;
    pointDetailsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function closePointDetails() {
    pointDetailsPanel.hidden = true;
    pointMetricDetails.replaceChildren();
  }

  function parsePointDetails(item) {
    let details = item?.details ?? item?.data ?? {};
    if (typeof details === "string") {
      try { details = JSON.parse(details); } catch (e) { details = {}; }
    }
    return details && typeof details === "object" ? details : {};
  }

  function resetVmFilter() {
    selectedVmUuid = "";
    clusterVms = [];
    lastNgtPointItem = null;
    if (!vmSearch || !vmFilter) return;
    vmSearch.value = "";
    replaceOptions(vmFilter, "Select a cluster first", []);
    vmSearch.disabled = true;
    vmFilter.disabled = true;
    if (ngtStateFilter) {
      replaceOptions(ngtStateFilter, "All NGT States", []);
      ngtStateFilter.disabled = true;
    }
    if (ngtEnabledFilter) {
      replaceOptions(ngtEnabledFilter, "All", []);
      ngtEnabledFilter.disabled = true;
    }
    if (ngtReachableFilter) {
      ngtReachableFilter.value = "";
      ngtReachableFilter.disabled = true;
    }
  }

  function vmMatchesNgtFilters(vm) {
    const state = (ngtStateFilter && ngtStateFilter.value) || "";
    const enabled = (ngtEnabledFilter && ngtEnabledFilter.value) || "";
    const reachable = (ngtReachableFilter && ngtReachableFilter.value) || "";
    if (state && String(vm.ngt_state || "") !== state) return false;
    if (enabled && String(vm.ngt_enabled_state || "") !== enabled) return false;
    if (reachable) {
      const isReachable = vm.is_reachable === true || vm.is_reachable === "Yes";
      if (reachable === "Yes" && !isReachable) return false;
      if (reachable === "No" && isReachable) return false;
    }
    return true;
  }

  function uniqueSorted(values) {
    return Array.from(new Set(values.filter((value) => value))).sort();
  }

  function populateNgtFilterOptions() {
    if (!isNgtStat()) return;
    const previousState = ngtStateFilter ? ngtStateFilter.value : "";
    const previousEnabled = ngtEnabledFilter ? ngtEnabledFilter.value : "";
    const states = uniqueSorted(clusterVms.map((vm) => vm.ngt_state));
    const enabled = uniqueSorted(clusterVms.map((vm) => vm.ngt_enabled_state));
    if (ngtStateFilter) {
      replaceOptions(
        ngtStateFilter,
        "All NGT States",
        states.map((value) => ({ key: value, label: value }))
      );
      ngtStateFilter.value = states.includes(previousState) ? previousState : "";
      ngtStateFilter.disabled = !clusterVms.length;
    }
    if (ngtEnabledFilter) {
      replaceOptions(
        ngtEnabledFilter,
        "All",
        enabled.map((value) => ({ key: value, label: value }))
      );
      ngtEnabledFilter.value = enabled.includes(previousEnabled) ? previousEnabled : "";
      ngtEnabledFilter.disabled = !clusterVms.length;
    }
    if (ngtReachableFilter) {
      ngtReachableFilter.disabled = !clusterVms.length;
    }
  }

  function collectClusterVms(series) {
    const vmsByUuid = new Map();
    series.forEach((item) => {
      const details = parsePointDetails(item);
      (Array.isArray(details.vms) ? details.vms : []).forEach((vm) => {
        const uuid = String(vm?.uuid || "").trim();
        if (!uuid) return;
        vmsByUuid.set(uuid, {
          uuid,
          name: String(vm.name || "Unknown"),
          ngt_state: String(vm.ngt_state || ""),
          ngt_enabled_state: String(vm.ngt_enabled_state || ""),
          is_reachable: Boolean(vm.is_reachable)
        });
      });
    });
    const nameCounts = {};
    vmsByUuid.forEach((vm) => {
      nameCounts[vm.name] = (nameCounts[vm.name] || 0) + 1;
    });
    return Array.from(vmsByUuid.values())
      .map((vm) => ({
        ...vm,
        label: nameCounts[vm.name] > 1
          ? `${vm.name} (${vm.uuid.slice(0, 8)})`
          : vm.name
      }))
      .sort((a, b) => a.label.localeCompare(b.label));
  }

  function refreshVmOptions() {
    if (!isNgtStat() || !vmFilter || !vmSearch) return;
    const query = (vmSearch.value || "").trim().toLowerCase();
    const filtered = clusterVms.filter((vm) => {
      if (!vmMatchesNgtFilters(vm)) return false;
      if (!query) return true;
      return vm.name.toLowerCase().includes(query)
        || vm.uuid.toLowerCase().includes(query)
        || vm.label.toLowerCase().includes(query);
    });
    const options = filtered.map((vm) => ({ key: vm.uuid, label: vm.label }));
    let placeholder = "Select a cluster first";
    if (targetFilter.value && !clusterVms.length) placeholder = "No VMs found";
    else if (targetFilter.value && !options.length) placeholder = "No matching VMs";
    else if (targetFilter.value) placeholder = `Select VM (${options.length})`;
    replaceOptions(vmFilter, placeholder, options);

    let nextUuid = "";
    if (query && options.length) {
      const exact = filtered.find((vm) =>
        vm.name.toLowerCase() === query
        || vm.uuid.toLowerCase() === query
        || vm.label.toLowerCase() === query
      );
      const startsWith = filtered.find((vm) =>
        vm.name.toLowerCase().startsWith(query)
        || vm.label.toLowerCase().startsWith(query)
      );
      if (exact) nextUuid = exact.uuid;
      else if (filtered.length === 1) nextUuid = filtered[0].uuid;
      else if (startsWith) nextUuid = startsWith.uuid;
    } else if (!query && options.some((item) => item.key === selectedVmUuid)) {
      nextUuid = selectedVmUuid;
    }

    selectedVmUuid = nextUuid;
    vmFilter.value = nextUuid;
    vmSearch.disabled = !targetFilter.value;
    vmFilter.disabled = !targetFilter.value || options.length === 0;
  }

  function showSelectedVmDetails() {
    if (!pointRecords.length) {
      closePointDetails();
      return;
    }
    if (selectedVmUuid) {
      showPointDetails(pointRecords[pointRecords.length - 1]);
      return;
    }
    if (isNgtStat() && targetFilter.value) {
      showLatestNgtDetails();
      return;
    }
    closePointDetails();
  }

  function syncVmFilterFromSeries(series) {
    if (!isNgtStat()) return;
    if (!targetFilter.value) {
      resetVmFilter();
      closePointDetails();
      return;
    }
    clusterVms = collectClusterVms(series);
    populateNgtFilterOptions();
    vmSearch.disabled = false;
    refreshVmOptions();
    showLatestNgtDetails();
  }

  async function fetchStatsData() {
    if (status) {
      status.hidden = false;
      status.classList.remove("error");
      status.textContent = "Loading data…";
    }

    const target = targetFilter.value;
    const params = new URLSearchParams({ stat: "{{ selected_stat_key|escapejs }}", range: currentRange });
    if (target) params.set("target", target);
    if (setupTypeFilter.value) params.set("endpoint_type", setupTypeFilter.value);

    try {
      const response = await fetch("{% url 'stats_data_api' %}?" + params.toString());
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Unable to load stats data.");

      const seen = new Set();
      const series = (payload.series || []).filter((item) => {
        const key = `${item.timestamp}|${item.ip}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      pointRecords = series;
      if (isNgtStat()) {
        if (!target || !series.length) {
          closePointDetails();
        }
        syncVmFilterFromSeries(series);
        return;
      }

      const labels = [];
      closePointDetails();

      series.forEach((item) => {
        const date = new Date(item.timestamp);
        labels.push(currentRange.endsWith("h")
          ? date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : date.toLocaleDateString([], { month: "short", day: "numeric" }));
      });

      pointRecords = series;
      chart.data.labels = labels;

      chart.data.datasets.forEach((dataset, index) => {
        const key = datasetConfig[index].key;
        dataset.data = series.map((item) => {

          if (config.parser === "snapshot_usage") {
            let parsedData = item.data;
            if (typeof parsedData === "string") { try { parsedData = JSON.parse(parsedData); } catch(e){} }
            let val = parsedData?.recovery_point_usage;
            if (val !== undefined) return val == null ? null : Number(val);
          }

          if (config.parser === "expired_snapshots") {
            let parsedData = item.data;
            if (typeof parsedData === "string") { try { parsedData = JSON.parse(parsedData); } catch(e){} }
            if (parsedData?.is_successful === false) return null;
            let val = parsedData?.summary_data?.total_expired_snapshots;
            if (val !== undefined) return val == null ? null : Number(val);
          }

          if (config.parser === "node_crash") {
            let parsedData = item.data;
            if (typeof parsedData === "string") { try { parsedData = JSON.parse(parsedData); } catch(e){} }
            let status = parsedData?.status;
            if (status === "PASS") return 1;
            if (status === "FAIL" || status === "ERROR") return 0;
            return null;
          }

          const sourceData = item.values || item.data || {};
          return Object.prototype.hasOwnProperty.call(sourceData, key)
            ? sourceData[key]
            : null;
        });
      });

      const hasNonZeroData = chart.data.datasets.some((dataset) =>
        dataset.data.some((value) => Number(value) !== 0)
      );
      chart.data.datasets.forEach((dataset) => {
        dataset.hidden = Boolean(
          config.hide_empty_datasets
          && hasNonZeroData
          && !dataset.data.some((value) => Number(value) !== 0)
        );
      });
      chart.update();

      status.hidden = series.length > 0;
      status.textContent = series.length ? "" : "No data is available for these filters and time range.";
      syncVmFilterFromSeries(series);
    } catch (error) {
      if (status) {
        status.hidden = false;
        status.classList.add("error");
        status.textContent = error.message;
      }
    }
  }

  function targetLabel() {
    return (config.target_labels || {})[setupTypeFilter.value] || "Target";
  }

  function formatTargetOption(item, endpointType) {
    const value = typeof item === "string" ? item : item.key;
    const originalLabel = typeof item === "string" ? item : item.label;
    const ipMatch = String(`${value} ${originalLabel}`).match(
      /\b(?:\d{1,3}\.){3}\d{1,3}\b/
    );
    const ip = ipMatch ? ipMatch[0] : String(value);
    const name = targetNames[ip];
    return {
      key: ip,
      label: name ? `${endpointType}: ${name} (${ip})` : `${endpointType}: ${ip}`
    };
  }

  function refreshTargets() {
    const type = setupTypeFilter.value;
    const pcs = azToPcs[azFilter.value] || [];
    let options = [];
    if (type === "PC") {
      options = pcs.map((pc) => formatTargetOption(pc, "PC"));
    } else if (type === "PE") {
      const seen = new Set();
      pcs.forEach((pc) => {
        (pcToPes[pc.key] || []).forEach((pe) => {
          const value = typeof pe === "string" ? pe : pe.key;
          if (!seen.has(value)) {
            seen.add(value);
            options.push(formatTargetOption(pe, "PE"));
          }
        });
      });
    }
    const label = targetLabel();
    targetFilterLabel.textContent = label;
    replaceOptions(targetFilter, `Select ${label}`, options);
    if (isNgtStat()) resetVmFilter();
  }

  const supportedTypes = config.endpoint_types || ["PC", "PE"];
  replaceOptions(
    setupTypeFilter,
    "Select Setup Type",
    supportedTypes.map((type) => ({ key: type, label: type }))
  );
  if (supportedTypes.length === 1) {
    setupTypeFilter.value = supportedTypes[0];
    setupTypeFilter.disabled = true;
  }

  azFilter.addEventListener("change", () => {
    refreshTargets();
    fetchStatsData();
  });
  setupTypeFilter.addEventListener("change", () => {
    refreshTargets();
    fetchStatsData();
  });
  targetFilter.addEventListener("change", () => {
    selectedVmUuid = "";
    if (vmSearch) vmSearch.value = "";
    fetchStatsData();
  });
  if (isNgtStat()) {
    vmSearch.addEventListener("input", () => {
      refreshVmOptions();
      showSelectedVmDetails();
    });
    vmFilter.addEventListener("change", () => {
      selectedVmUuid = vmFilter.value;
      showSelectedVmDetails();
    });
    const applyNgtFilters = () => {
      if (selectedVmUuid && !clusterVms.some(
        (vm) => vm.uuid === selectedVmUuid && vmMatchesNgtFilters(vm)
      )) {
        selectedVmUuid = "";
        if (vmFilter) vmFilter.value = "";
      }
      refreshVmOptions();
      if (pointRecords.length) {
        showPointDetails(lastNgtPointItem || pointRecords[pointRecords.length - 1]);
      }
    };
    if (ngtStateFilter) ngtStateFilter.addEventListener("change", applyNgtFilters);
    if (ngtEnabledFilter) ngtEnabledFilter.addEventListener("change", applyNgtFilters);
    if (ngtReachableFilter) ngtReachableFilter.addEventListener("change", applyNgtFilters);
  }
  pointDetailsClear.addEventListener("click", () => {
    if (isNgtStat()) {
      selectedVmUuid = "";
      if (vmSearch) vmSearch.value = "";
      refreshVmOptions();
      showLatestNgtDetails();
      return;
    }
    closePointDetails();
  });

  document.querySelectorAll(".time-btn").forEach((button) => {
    button.addEventListener("click", () => {
      currentRange = button.dataset.range;
      document.querySelectorAll(".time-btn").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
      fetchStatsData();
    });
  });

  fetchStatsData();
})();
</script>
